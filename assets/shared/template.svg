<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cenário provisório para os estúdios</title><desc id="desc">Uma sala simples com uma mesa à esquerda e uma porta à direita. Os alunos substituirão este cenário.</desc>
